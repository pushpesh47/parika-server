# PARIKA Default Configuration
# User-specific settings should be placed in higher-precedence configuration files.

[application]
name = "PARIKA"
version = "0.8.71"
environment = "production"

[assistant]
name = "PARIKA"
full_name = "Personal Adaptive Responsive Intelligence Kernel Assistant"
nick_name = "परी"
creator = "Pushpesh"
organization = "Independent Developer"
purpose = "To provide a modular, adaptive, and extensible intelligence kernel capable of understanding, reasoning, learning, remembering, planning, executing tasks, and orchestrating intelligent capabilities."
description = "PARIKA is a modular intelligence kernel that continuously understands context, reasons intelligently, learns from interactions, builds and retrieves knowledge, maintains long-term memory, plans and executes complex tasks, and integrates extensible capabilities to provide a unified and continuously evolving intelligence."
website = ""
repository = ""
license = "MIT"

# Routing model selection mode. "auto" uses model_selection scoring; "fixed" uses fixed_model directly.
[routing_model]
mode = "fixed"
fixed_model = "qwen3.5:4b"
fixed_thinking = false

[logging]
level = "DEBUG"
console = false
directory = "logs"
file = "parika.log"
forensic_file = "parika-forensic-logs.log"

[data]
directory = "data"

# Autonomous Runtime
[autonomous]
enabled = true
max_cpu_percent = 90.0
max_memory_percent = 90.0

[plugins]
directory = "plugins"
autoload = true

[modules]
autoload = true

# Workspace - default_workspace is the one directory PARIKA always trusts
[workspace]
default_workspace = "data"

# Filesystem - reads always allowed; writes/deletes confined to trusted workspaces
[filesystem]
enabled = true
trusted_workspaces = []
allow_write = true
allow_delete = false
default_search_recursive = true
max_walk_entries = 5000
watch_poll_interval_seconds = 1.0
watch_max_duration_seconds = 10.0

[security]
allow_shell_commands = true

# Coding Tool - semantic source-code understanding
[coding]
enabled = true
tree_sitter_enabled = true
max_file_size_bytes = 2000000


# Coding Agent - orchestrator over Planner/Brain/Tools
[coding_agent]
enabled = true
default_max_depth = 3
require_test_run = false
allowed_write_roots = []
default_agent = "standard"

[coding.formatters]
python = ["ruff", "format"]

[coding.linters]
python = ["ruff", "check", "--output-format=json"]

# Repository Intelligence - workspace/project discovery
[repository_intelligence]
enabled = true
ignored_directories = [
    ".git", "node_modules", ".venv", "venv", "__pycache__",
    ".mypy_cache", ".pytest_cache", "dist", "build", "target",
]
git_recent_commits_limit = 20

# OCR - text extraction, quality detection, preprocessing
[ocr]
enabled = true
preprocessing_enabled = true
language_detection_enabled = true
max_deskew_angle_degrees = 15.0
low_resolution_min_dimension = 1000
blur_variance_threshold = 100.0
quality_score_minimum = 0.5
pdf_render_dpi = 200
pdf_min_text_layer_chars = 20


# API / Server Platform - python -m parika.server
# Security warning: [api.auth].mode = "none" is safe only with host = "127.0.0.1" (loopback).
# For LAN access (host = "0.0.0.0"), use mode = "api_key" with [api.auth].api_keys.
[api]
enabled = true
host = "0.0.0.0"
port = 2026
expose_hostname = false

[api.auth]
mode = "none"
api_keys = []
jwt_expiry_seconds = 3600

[api.cors]
allow_origins = []
allow_origin_regex = "http://(127\\.0\\.0\\.1|localhost)(?::\\d+)?"
allow_lan_origin_regex = ""

[api.rate_limit]
enabled = false
requests_per_minute = 600000

# Shell Module - enabled = false by default
# Every shell.execute/shell.background uses shared WorkspacePermissionManager
[shell]
enabled = true
default_timeout_seconds = 30.0
max_timeout_seconds = 300.0
max_background_processes = 20
output_buffer_max_bytes = 65536
kill_grace_period_seconds = 5.0
allow_shell_string = true
inherit_environment = true


# PARIKA Console (parika/console/) - native in-process REPL
[interfaces.cli]
prompt = "\u276f"
banner = "PARIKA"
markdown = true
color = true
stream = true
history_file = "data/cli_history"
history_size = 1000
progress = true
debug = false
tool_footer_mode = "smart"

# Memory retrieval scoring weights (lexical signals only)
[memory]
relevance_weight = 1.0
recency_weight = 0.5
importance_weight = 0.5
frequency_weight = 0.25
confidence_weight = 0.5
recency_half_life_seconds = 86400.0
candidate_pool_multiplier = 5


# Context Engine - token budget for context assembly, compaction, runtime
[context_engine]
default_context_window_tokens = 8192
reserved_for_response_tokens = 1024
safety_reserve_tokens = 256
warning_threshold = 0.8

# Concurrency - max concurrent Goals per Brain request
[concurrency]
max_concurrent_goals = 4
execution_mode = "parallel"


# PostgreSQL Database - REQUIRED. Connection parameters MUST be provided via environment variables:
# PARIKA_DATABASE__HOST, PARIKA_DATABASE__PORT, PARIKA_DATABASE__DATABASE, PARIKA_DATABASE__USERNAME, PARIKA_DATABASE__PASSWORD
[database]
enabled = true
pool_min_size = 2
pool_max_size = 10
connect_timeout = 10.0
statement_timeout = 0.0
application_name = "parika"

# Resource Manager - controls on-demand system telemetry (CPU, memory, disk, GPU, temp, network)
[resources]
gpu_telemetry_enabled = true
temperature_telemetry_enabled = true
network_interfaces_enabled = true
recommended_client_poll_interval_seconds = 5.0

# Intelligent Model Selection - tunes how Planner scores/selects Provider models
[model_selection]
default_strategy = "weighted"
fallback_strategy = "highest_score"
allow_provider_fallback = true
allow_model_fallback = true
enable_dynamic_latency_learning = true
enable_dynamic_performance_learning = true
log_decision = true

[model_selection.weights]
latency = 40
reasoning = 25
tool_calling = 20
context_window = 10
cost = 5
experience = 0

[model_selection.preferences]
prefer_local = true
prefer_streaming = true
prefer_healthier_provider = true
prefer_lower_latency = true
prefer_larger_context = false

# Maps reasoning_level to thinking mode ("off" | "auto" | "on")
[model_selection.reasoning]
simple = "off"
normal = "auto"
complex = "on"

# Document - single entry point for document processing
[document]
enabled = true
max_reference_candidates = 200
max_keywords = 15
search_context_chars = 80

# Video - deterministic frame decoding, scene/motion/quality detection
[video]
enabled = true
max_sample_frames = 64
describe_frame_count = 6
summarize_frame_count = 10
answer_question_frame_count = 6
classify_frame_count = 4
dense_sample_target_fps = 2.0
focus_window_seconds = 6.0
scene_change_threshold = 0.35
blur_variance_threshold = 100.0
black_frame_brightness_threshold = 16.0
motion_pixel_threshold = 25
motion_area_ratio_threshold = 0.01
min_slide_duration_seconds = 2.0
thumbnail_columns = 4
thumbnail_rows = 4
thumbnail_cell_width = 240


# Weather - Open-Meteo (free, no API key)
[weather]
enabled = true
units = "metric"
request_timeout_seconds = 10.0
max_attempts = 3
backoff_seconds = 0.5
default_forecast_days = 7
cache_ttl_seconds = 1200

# Currency - free providers, no API key
[currency]
enabled = true
default_provider = "frankfurter"
provider_order = ["frankfurter", "open_er_api"]
request_timeout_seconds = 10.0
max_attempts = 3
backoff_seconds = 0.5

# Expense Management
[expense]
enabled = true
default_currency = "INR"
categories = [
    "Food", "Groceries", "Medicine", "Transport", "Travel",
    "Shopping", "Bills", "Education", "Investment", "Personal",
    "Household", "Other",
]
default_list_limit = 500
max_list_results = 2000
default_largest_count = 55

# News - RSS/Atom feeds, no API key
[news]
enabled = true
default_max_results = 10
feed_timeout_seconds = 10.0
max_attempts = 3
backoff_seconds = 0.5
latest_feeds = [
    "https://feeds.bbci.co.uk/news/rss.xml",
    "https://www.npr.org/rss/rss.php?id=1001",
]

[news.feeds]
world = ["https://feeds.bbci.co.uk/news/world/rss.xml"]
business = ["https://feeds.bbci.co.uk/news/business/rss.xml"]
technology = ["https://feeds.bbci.co.uk/news/technology/rss.xml"]
science = ["https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"]
health = ["https://feeds.bbci.co.uk/news/health/rss.xml"]
politics = ["https://feeds.bbci.co.uk/news/politics/rss.xml"]
sports = ["https://feeds.bbci.co.uk/sport/rss.xml"]
entertainment = ["https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml"]


[providers.ollama]
enabled = true
base_url = "http://127.0.0.1:11434"
connect_timeout_seconds = 120.0
request_timeout_seconds = 600000.0
max_tool_iterations = 5

# Cloud Provider Slots - provider identity, model, base URL, API key, reasoning config
# are supplied via environment variables (see .env.example). No TOML edit required.
[cloud_providers.primary]
provider = "PARIKA_ROUTING__CLOUD__PRIMARY_PROVIDER"
base_url = "PARIKA_ROUTING__CLOUD__PRIMARY_PROVIDER_BASE_URL"
model = "PARIKA_ROUTING__CLOUD__PRIMARY_PROVIDER_MODEL"
api_key_env = "PARIKA_ROUTING__CLOUD__PRIMARY_PROVIDER_KEY"
supported_parameters = ["temperature", "top_p", "max_tokens", "stop"]
reasoning_request_path = "PARIKA_ROUTING__CLOUD__PRIMARY_PROVIDER_REASONING_REQUEST_PATH"

[cloud_providers.secondary]
provider = "PARIKA_ROUTING__CLOUD__SECONDARY_PROVIDER"
base_url = "PARIKA_ROUTING__CLOUD__SECONDARY_PROVIDER_BASE_URL"
model = "PARIKA_ROUTING__CLOUD__SECONDARY_PROVIDER_MODEL"
api_key_env = "PARIKA_ROUTING__CLOUD__SECONDARY_PROVIDER_KEY"
supported_parameters = ["temperature", "top_p", "max_tokens", "stop"]
reasoning_request_path = "PARIKA_ROUTING__CLOUD__SECONDARY_PROVIDER_REASONING_REQUEST_PATH"

[cloud_providers.fallback]
provider = "PARIKA_ROUTING__CLOUD__FALLBACK_PROVIDER"
base_url = "PARIKA_ROUTING__CLOUD__FALLBACK_PROVIDER_BASE_URL"
model = "PARIKA_ROUTING__CLOUD__FALLBACK_PROVIDER_MODEL"
api_key_env = "PARIKA_ROUTING__CLOUD__FALLBACK_PROVIDER_KEY"
supported_parameters = ["temperature", "top_p", "max_tokens", "stop"]
reasoning_request_path = "PARIKA_ROUTING__CLOUD__FALLBACK_PROVIDER_REASONING_REQUEST_PATH"

# ComfyUI Provider - local HTTP service for image/video generation
# Model paths are relative to ComfyUI's models/ subfolders (never absolute paths).
[providers.comfyui]
enabled = true
base_url = "http://127.0.0.1:8188"
connect_timeout_seconds = 10.0
request_timeout_seconds = 600000.0
poll_interval_seconds = 2.0
poll_timeout_seconds = 600000.0
image_diffusion_model = "qwen-image/qwen_image_fp8_e4m3fn.safetensors"
image_text_encoder = "qwen/qwen_2.5_vl_7b_fp8_scaled.safetensors"
image_vae = "qwen-image/qwen_image_vae.safetensors"
video_t2v_diffusion_model = "Wan2.1/wan2.1_t2v_1.3B_bf16.safetensors"
video_t2v_loader = "native"
video_t2v_weight_dtype = "default"
video_vace_diffusion_model = "wan2.1_vace_1.3B_fp8_scaled.safetensors"
video_vace_loader = "native"
video_vace_weight_dtype = "fp8_e4m3fn"
video_text_encoder = "umt5_xxl_fp8_e4m3fn_scaled.safetensors"
video_vae = "wan_2.1_vae.safetensors"

# Generation Module output directory (relative to [workspace].default_workspace)
[generation]
enabled = true
output_directory = "generated"

# Local Speech Provider - STT/TTS engines for Voice Module
# Model files must be placed manually; no auto-download.
[providers.local_speech]
enabled = true
stt_engine = "faster_whisper"
stt_model_size = "small"
stt_device = "auto"
stt_compute_type = "default"
stt_default_language = ""
stt_model_directory = ""
stt_beam_size = 5
tts_kokoro_voice = "hf_beta"
tts_kokoro_model_path = "/mnt/dev/python/parika/models/voice/kokoro/kokoro-v1.0.onnx"
tts_kokoro_voices_path = "/mnt/dev/python/parika/models/voice/kokoro/voices-v1.0.bin"
tts_kokoro_speed = 1.0

# Voice Module - controls TTS chunking and language preferences
[voice]
enabled = true
tts_chunk_max_characters = 280
input_language = "auto"

# Media Module - playback handled by Web Client over WS
# allowed_local_roots: empty = local path playback disabled
[media]
enabled = true
allowed_local_roots = []
youtube_search_enabled = true

# Web Search - provider ordering and result ranking/dedup/validation
[web_search]
enabled = true
default_provider = "parallel_mcp"
provider_order = [
    "parallel_mcp",
    "bing",
    "mojeek",
    "qwant",
    "duckduckgo",
    "google",
    "google_cse",
]
default_max_results = 10
candidate_pool_size = 20
ranking_enabled = true
ranking_title_weight = 2.0
ranking_snippet_weight = 1.0
ranking_position_decay = 0.01
dedup_enabled = true
dedup_title_similarity_threshold = 0.92
validation_enabled = true
validation_min_confidence = 0.15
validation_max_retries = 1
validation_title_weight = 0.5
validation_snippet_weight = 0.3
validation_url_weight = 0.2
cache_enabled = true
cache_ttl_seconds = 900.0
cache_max_entries = 500

[web_search.google_cse]
# Credentials MUST be provided via environment variables:
# PARIKA_WEB_SEARCH__GOOGLE_CSE__API_KEY
# PARIKA_WEB_SEARCH__GOOGLE_CSE__SEARCH_ENGINE_ID